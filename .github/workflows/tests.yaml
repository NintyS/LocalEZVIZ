name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e '.[test]'
      - name: Run backend tests
        run: pytest --cov --cov-report=term-missing
      - name: Check frontend syntax and safety contract
        run: node --check custom_components/ptz_proxy/frontend/ptz-camera-card.js && node --test tests/frontend/test_ptz_camera_card.mjs
